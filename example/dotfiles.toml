# The same rice the 1898-line install.sh of ilyamiro/imperative-dots installs,
# expressed as a bundle. Collected from a real machine, so the lists below are
# what is actually installed, not what upstream ships.

schema      = 1
name        = "imperative-hyprland"
version     = "0.1.0"
description = "imperative-dots, customized — quickshell UI, matugen colors, fish"
author      = "murat-akpinar"
homepage    = "https://github.com/murat-akpinar/dotpack"
license     = "GPL-3.0"

wm     = "hyprland"
distro = "arch"
mode   = "symlink"

# Only user units. NetworkManager, sddm, power-profiles-daemon and
# swayosd-libinput-backend are root services — upstream's installer enables them
# with sudo, a bundle may not. They belong in a post-install hook the user reads
# first.
services = ["easyeffects"]

ignore = [
  "config/hypr/config/monitors.conf",   # autogenerated, one entry per physical monitor
  "config/hypr/settings.json",          # autogenerated from the quickshell settings UI
]

[packages]
# 71 packages, lifted from the ARCH_PKGS array at install.sh:157.
pacman = [
  "hyprland", "hypridle", "kitty", "cava", "zbar", "pavucontrol", "alsa-utils", "awww",
  "wl-clipboard", "fd", "qt6-multimedia", "qt6-5compat", "ripgrep", "cliphist", "jq",
  "socat", "inotify-tools", "pamixer", "brightnessctl", "acpi", "iw", "bluez",
  "bluez-utils", "libnotify", "networkmanager", "lm_sensors", "bc", "pipewire",
  "wireplumber", "pipewire-pulse", "pipewire-alsa", "pipewire-jack", "libpulse", "python",
  "imagemagick", "wget", "file", "git", "psmisc", "ffmpeg", "fastfetch", "quickshell-git",
  "unzip", "python-websockets", "qt6-websockets", "grim", "playerctl", "satty", "yq",
  "xdg-desktop-portal-gtk", "slurp", "mpvpaper", "wmctrl", "power-profiles-daemon",
  "easyeffects", "nautilus", "lsp-plugins", "hyprpolkitagent", "qt5-wayland",
  "qt5-quickcontrols", "qt5-quickcontrols2", "qt5-graphicaleffects", "qt6-wayland",
  "qt5ct", "qt6ct", "gpu-screen-recorder", "adw-gtk-theme", "xdg-desktop-portal-wlr"
]
yay = ["matugen-bin", "swayosd-git", "networkmanager-dmenu-git"]

[components]
wm         = "hyprland"
compositor = "hyprland"
shell      = "fish"          # upstream offers zsh; this machine runs fish
fetch      = "fastfetch"
idle       = "hypridle"
clipboard  = "cliphist"

bar        = { pkg = "quickshell-git", from = "ilyamiro/imperative-dots", note = "the rice's own QML shell, not vendored here" }
launcher   = { pkg = "quickshell-git", note = "applauncher module of the same shell" }
lockscreen = { pkg = "quickshell-git", note = "scripts/lock.sh calls the shell's lock module" }
terminal   = { pkg = "kitty" }
editor     = { pkg = "neovim" }
filemanager = { pkg = "nautilus" }
screenshot = { pkg = "grim", note = "grim + slurp + satty" }
wallpaper  = { pkg = "awww", note = "awww-daemon, started from autostart.conf" }
colorscheme = { pkg = "matugen-bin", note = "colors.conf is regenerated from the wallpaper" }

gtk_theme = { pkg = "adw-gtk-theme", name = "adw-gtk3" }
icons     = { pkg = "adwaita-icon-theme", name = "Adwaita" }
cursor    = { name = "Bibata-Modern-Ice", url = "https://github.com/ful1e5/Bibata_Cursor", note = "lives in ~/.local/share/icons, no package owns it" }

# Both fonts are hand-installed under ~/.local/share/fonts — `pacman -Qoq` finds
# no owner. A complete bundle would ship them in local/share/fonts/ instead.
font_terminal = { name = "CaskaydiaMono Nerd Font Mono", url = "https://github.com/ryanoasis/nerd-fonts" }
font_system   = { name = "CaskaydiaMono Nerd Font Mono Semi-Bold 12", url = "https://github.com/ryanoasis/nerd-fonts" }

prompt = { name = "starship", url = "https://starship.rs", note = "in /usr/local/bin, installed by the upstream script, not a package" }
