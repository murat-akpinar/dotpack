# The same rice the 1898-line install.sh of ilyamiro/imperative-dots installs,
# expressed as a bundle. Collected from a real machine, so the lists below are
# what is actually installed, not what upstream ships.

schema      = 1
name        = "imperative-hyprland"
version     = "0.1.0"
description = "imperative-dots, customized — quickshell UI, matugen colors, fish"
author      = "murat-akpinar"
homepage    = "https://github.com/murat-akpinar/dotpack"
license     = "GPL-3.0"

wm     = "hyprland"
distro = "arch"
mode   = "symlink"

# Only user units. NetworkManager, sddm, power-profiles-daemon and
# swayosd-libinput-backend are root services — upstream's installer enables them
# with sudo, a bundle may not. They belong in a post-install hook the user reads
# first.
services = ["easyeffects"]

# `ignore` is collect-time only: these paths never enter the bundle. It cannot skip a
# file at install time — ~/.config/hypr is placed as one directory link.
#
# monitors.conf is NOT ignored, deliberately. hyprland.conf sources it unconditionally,
# so leaving it out would hand the receiver a config error instead of a working rice.
# It ships with this machine's two monitors in it and the README says to edit it. That
# is the honest v1 answer to machine-specific data — see docs/design.md §7.
ignore = [
  "config/hypr/settings.json",   # autogenerated by the quickshell settings UI
  "config/hypr/scripts/*.log",
]

# scripts/quickshell/ — the rice's own QML shell — is NOT in this bundle, and every
# script that calls into it (lock.sh, screenshot.sh, qs_manager.sh) is therefore
# dangling. See README § "What the collection turned up", item 5.

[packages]
# 68 packages lifted from the ARCH_PKGS array at install.sh:157, plus 2 the scan found
# that upstream's array does not contain (see the note at the end of the list).
pacman = [
  "hyprland", "hypridle", "kitty", "cava", "zbar", "pavucontrol", "alsa-utils", "awww",
  "wl-clipboard", "fd", "qt6-multimedia", "qt6-5compat", "ripgrep", "cliphist", "jq",
  "socat", "inotify-tools", "pamixer", "brightnessctl", "acpi", "iw", "bluez",
  "bluez-utils", "libnotify", "networkmanager", "lm_sensors", "bc", "pipewire",
  "wireplumber", "pipewire-pulse", "pipewire-alsa", "pipewire-jack", "libpulse", "python",
  "imagemagick", "wget", "file", "git", "psmisc", "ffmpeg", "fastfetch", "quickshell",
  "unzip", "python-websockets", "qt6-websockets", "grim", "playerctl", "satty", "yq",
  "xdg-desktop-portal-gtk", "slurp", "mpvpaper", "wmctrl", "power-profiles-daemon",
  "easyeffects", "nautilus", "lsp-plugins", "hyprpolkitagent", "qt5-wayland",
  "qt5-quickcontrols", "qt5-quickcontrols2", "qt5-graphicaleffects", "qt6-wayland",
  "qt5ct", "qt6ct", "gpu-screen-recorder", "adw-gtk-theme", "xdg-desktop-portal-wlr",

  # Not in upstream's ARCH_PKGS array — found by the scan, and by hand neither of these
  # would have made the list. Both are installed on this machine WITHOUT a package:
  # starship came from its curl script into /usr/local/bin, the font was unzipped into
  # ~/.local/share/fonts. `pacman -Qoq` reports no owner for either; `pacman -F` on the
  # basename finds both in `extra`. See docs/design.md §5.2 and real-world.md F17.
  "starship", "ttf-cascadia-mono-nerd"
]
# `quickshell-git` used to be in the list above. No such package exists — not in any
# repo, not installed here. `pacman -Qoq $(command -v quickshell)` names the real
# provider, and `quickshell` is the repo package the rice's QML actually runs on. A
# hand-written manifest guessed a name; the scan would not have.
yay = ["matugen-bin", "swayosd-git", "networkmanager-dmenu-git"]

[components]
wm         = "hyprland"
compositor = "hyprland"
shell      = "fish"          # upstream offers zsh; this machine runs fish
fetch      = "fastfetch"
idle       = "hypridle"
clipboard  = "cliphist"

bar        = { pkg = "quickshell-git", from = "ilyamiro/imperative-dots", note = "the rice's own QML shell, not vendored here" }
launcher   = { pkg = "quickshell-git", note = "applauncher module of the same shell" }
lockscreen = { pkg = "quickshell-git", note = "scripts/lock.sh calls the shell's lock module" }
terminal   = { pkg = "kitty" }
editor     = { pkg = "neovim" }
filemanager = { pkg = "nautilus" }
screenshot = { pkg = "grim", note = "grim + slurp + satty" }
wallpaper  = { pkg = "awww", note = "awww-daemon, started from autostart.conf" }
colorscheme = { pkg = "matugen-bin", note = "colors.conf is regenerated from the wallpaper" }

gtk_theme = { pkg = "adw-gtk-theme", name = "adw-gtk3" }
icons     = { pkg = "adwaita-icon-theme", name = "Adwaita" }
# Hand-installed under ~/.local/share/fonts, but `extra` ships the same font — so it is
# a package, not a url and not 40 MB of .ttf in the bundle. The receiver gets the font
# from pacman and `fc-cache -f` runs after install.
font_terminal = { pkg = "ttf-cascadia-mono-nerd", name = "CaskaydiaMono Nerd Font Mono" }
font_system   = { pkg = "ttf-cascadia-mono-nerd", name = "CaskaydiaMono Nerd Font Mono Semi-Bold 12" }

# Same story: /usr/local/bin/starship has no owning package, `extra/starship` exists.
prompt = { pkg = "starship" }

# The genuine last resort, and the only one left in this bundle: no package provides it,
# and it is not shipped here either. Printed in the install summary as a manual step —
# dotpack does not fetch it.
cursor = { name = "Bibata-Modern-Ice", url = "https://github.com/ful1e5/Bibata_Cursor", note = "lives in ~/.local/share/icons, no package owns it" }
