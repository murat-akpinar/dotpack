# The 1898-line install.sh of ilyamiro/imperative-dots, as a bundle. Collected from a
# real machine: the lists below are what is installed, not what upstream ships.
# Why each awkward entry is what it is → README.md.

schema      = 1
name        = "imperative-hyprland"
version     = "0.1.0"
description = "imperative-dots, customized — quickshell UI, matugen colors, fish"
author      = "murat-akpinar"
homepage    = "https://github.com/murat-akpinar/dotpack"
license     = "GPL-3.0"

wm     = "hyprland"
distro = "arch"
mode   = "symlink"

# --- services start ---
# User units only. NetworkManager, sddm, power-profiles-daemon and
# swayosd-libinput-backend need root and belong in a post-install hook.
# Empty, and not by omission: easyeffects ships no user unit — see the README.
services = []
# --- services end ---

# --- ignore start ---
# Collect-time only. Safe here because settings.json's only consumer falls back when it
# is absent. monitors.conf is deliberately NOT listed: hyprland.conf sources it.
ignore = [
  "config/hypr/settings.json",
  "config/hypr/scripts/*.log",
]
# --- ignore end ---

# --- packages start ---
[packages]
pacman = [
  "hyprland", "hypridle", "kitty", "cava", "zbar", "pavucontrol", "alsa-utils", "awww",
  "wl-clipboard", "fd", "qt6-multimedia", "qt6-5compat", "ripgrep", "cliphist", "jq",
  "socat", "inotify-tools", "pamixer", "brightnessctl", "acpi", "iw", "bluez",
  "bluez-utils", "libnotify", "networkmanager", "lm_sensors", "bc", "pipewire",
  "wireplumber", "pipewire-pulse", "pipewire-alsa", "pipewire-jack", "libpulse", "python",
  "imagemagick", "wget", "file", "git", "psmisc", "ffmpeg", "fastfetch", "quickshell",
  "unzip", "python-websockets", "qt6-websockets", "grim", "playerctl", "satty", "yq",
  "xdg-desktop-portal-gtk", "slurp", "mpvpaper", "wmctrl", "power-profiles-daemon",
  "easyeffects", "nautilus", "lsp-plugins", "hyprpolkitagent", "qt5-wayland",
  "qt5-quickcontrols", "qt5-quickcontrols2", "qt5-graphicaleffects", "qt6-wayland",
  "qt5ct", "qt6ct", "gpu-screen-recorder", "adw-gtk-theme", "xdg-desktop-portal-wlr",
  "fish", "neovim", "adwaita-icon-theme", "starship", "ttf-cascadia-mono-nerd"
]
yay = ["matugen-bin", "swayosd-git", "networkmanager-dmenu-git"]
# --- packages end ---

# --- components start ---
[components]
wm         = "hyprland"
compositor = "hyprland"
shell      = "fish"
fetch      = "fastfetch"
idle       = "hypridle"
clipboard  = "cliphist"

bar        = { pkg = "quickshell", from = "ilyamiro/imperative-dots", note = "the rice's own QML shell, not vendored here" }
launcher   = { pkg = "quickshell", note = "applauncher module of the same shell" }
lockscreen = { pkg = "quickshell", note = "scripts/lock.sh calls the shell's lock module" }
terminal   = { pkg = "kitty" }
editor     = { pkg = "neovim" }
filemanager = { pkg = "nautilus" }
screenshot = { pkg = "grim", note = "grim + slurp + satty" }
wallpaper  = { pkg = "awww", note = "awww-daemon, started from autostart.conf" }
colorscheme = { pkg = "matugen-bin", note = "colors.conf is regenerated from the wallpaper" }

gtk_theme = { pkg = "adw-gtk-theme", name = "adw-gtk3" }
icons     = { pkg = "adwaita-icon-theme", name = "Adwaita" }

font_terminal = { pkg = "ttf-cascadia-mono-nerd", name = "CaskaydiaMono Nerd Font Mono" }
font_system   = { pkg = "ttf-cascadia-mono-nerd", name = "CaskaydiaMono Nerd Font Mono Semi-Bold 12" }
prompt = { pkg = "starship" }

# The only genuine manual step left: no package provides this cursor and it is not
# shipped here. Printed in the install summary; dotpack never fetches it.
cursor = { name = "Bibata-Modern-Ice", url = "https://github.com/ful1e5/Bibata_Cursor", note = "lives in ~/.local/share/icons, no package owns it" }
# --- components end ---
